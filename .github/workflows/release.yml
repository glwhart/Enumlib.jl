name: Release binaries

# Builds the standalone `enum.x` / `polya.x` app per platform with PackageCompiler
# and attaches the tarballs to the GitHub Release for the tag.
#
# Two triggers:
#   • push of a v* tag  — build, then upload the tarballs to that tag's Release
#                         (creating the Release if it does not exist yet).
#   • workflow_dispatch — build and upload as workflow artifacts ONLY. Nothing is
#                         published. Use this to validate a build without cutting
#                         a release.
#
# Why here and not on a workstation: create_app pulls the whole depot and compiles
# a system image, which is heavy and platform-specific. Runners give us a clean
# per-platform build with no local machine tied up.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the branch this is run from)'
        required: false
        type: string

permissions:
  contents: write     # required to create/update a Release and upload assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'          # matches the [compat] floor used by CI.yml

      - uses: julia-actions/cache@v2

      - name: Instantiate build environment
        run: julia --project=build -e 'using Pkg; Pkg.instantiate()'

      # Linux is built inside manylinux_2_28 (glibc 2.28) rather than on the
      # runner. ubuntu-latest has glibc 2.39, and the app it produced bundled a
      # libstdc++ requiring GLIBC_2.38 — so the binaries would not start on
      # RHEL/Rocky 8-9, on typical HPC login/compute nodes, or in conda-forge's
      # test image (glibc 2.34). Building against 2.28 covers all of those.
      # macOS and Windows are unaffected and build directly on the runner.
      - name: Build app in manylinux_2_28 (linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            quay.io/pypa/manylinux_2_28_x86_64 bash -euxo pipefail -c '
              curl -fsSL "https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11-latest-linux-x86_64.tar.gz" | tar xz -C /opt
              export PATH="$(echo /opt/julia-*/bin):$PATH"
              julia --version
              julia --project=build -e "using Pkg; Pkg.instantiate()"
              julia --project=build build/build_app.jl
            '
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Build app (create_app + --version smoke test)
        if: matrix.target != 'linux-x86_64'
        run: julia --project=build build/build_app.jl

      # Guard the reason the linux build moved into a container: if anything the
      # app loads needs a newer glibc than 2.28, catch it here rather than in a
      # user's shell on a cluster.
      # Guard the reason the linux build moved into a container: if anything the
      # app loads needs a newer glibc than 2.28, catch it here rather than in a
      # user's shell on a cluster.
      #
      # Deliberately loop instead of piping through xargs: objdump exits non-zero
      # on the non-ELF files that match *.so*, and with pipefail that aborts the
      # step before it can report anything (which is exactly what happened the
      # first time this ran).
      - name: Verify glibc floor (linux)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          max=0
          while IFS= read -r f; do
            v=$(objdump -T "$f" 2>/dev/null \
                  | grep -oE 'GLIBC_2\.[0-9]+' \
                  | sed 's/.*\.//' | sort -n | tail -1) || v=""
            if [ -n "$v" ] && [ "$v" -gt "$max" ]; then
              max="$v"
              echo "  new high: GLIBC_2.$v  ($f)"
            fi
          done < <(find build/app \( -name '*.so' -o -name '*.so.*' \) -o -path '*/bin/*' -type f)
          echo "highest GLIBC symbol required by the app: GLIBC_2.${max}"
          if [ "$max" -gt 28 ]; then
            echo "::error::app requires GLIBC_2.${max}, above the glibc 2.28 floor"
            exit 1
          fi

      - name: Rename executables to enum.x / polya.x / makestr.x
        shell: bash
        run: |
          cd build/app/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv enum.exe enum.x.exe
            mv polya.exe polya.x.exe
            mv makestr.exe makestr.x.exe
          else
            mv enum enum.x
            mv polya polya.x
            mv makestr makestr.x
          fi
          ls -la

      - name: Package tarball + checksum
        shell: bash
        run: |
          VERSION=$(julia -e 'm=match(r"(?m)^version\s*=\s*\"([^\"]+)\"", read("Project.toml", String)); print(m.captures[1])')
          NAME="enumlib-jl-${VERSION}-${{ matrix.target }}"
          mv build/app "$NAME"
          tar -czf "${NAME}.tar.gz" "$NAME"
          # Portable sha256 (shasum exists on macOS, sha256sum on Linux/Git-Bash).
          if command -v sha256sum >/dev/null; then
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          cat "${NAME}.tar.gz.sha256"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          du -h "${NAME}.tar.gz"

      # Dispatch runs stop here: artifacts only, nothing published.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Attach to the tag's Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Create the Release once; concurrent matrix jobs may race, so tolerate
          # "already exists" and fall through to the upload.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "See CHANGELOG.md for what changed in $TAG." || true
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
