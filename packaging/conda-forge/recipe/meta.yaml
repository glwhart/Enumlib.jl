{% set name = "enumlib-jl" %}
{% set version = "0.3.4" %}

# DRAFT — not submitted. See ../README.md for the migration plan and the open
# blockers (conda-forge/core must approve repackaging a prebuilt binary; sha256
# values below are placeholders until the v0.3.4 release build publishes).
#
# Repackages the PackageCompiler app built by .github/workflows/release.yml rather
# than compiling in the feedstock: create_app needs the whole Julia depot at build
# time, which does not fit conda-forge's reproducible-build norms.

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/glwhart/Enumlib.jl/releases/download/v{{ version }}/enumlib-jl-{{ version }}-linux-x86_64.tar.gz  # [linux and x86_64]
    sha256: PLACEHOLDER_LINUX_X86_64                                                                                          # [linux and x86_64]
  - url: https://github.com/glwhart/Enumlib.jl/releases/download/v{{ version }}/enumlib-jl-{{ version }}-macos-aarch64.tar.gz  # [osx and arm64]
    sha256: PLACEHOLDER_MACOS_AARCH64                                                                                         # [osx and arm64]

build:
  number: 0
  # The app bundles its own Julia runtime and libraries; conda's relocation
  # machinery must not rewrite them.
  binary_relocation: false
  detect_binary_files_with_prefix: false
  # Linux x86_64 and macOS arm64 only, matching the release artifacts. The
  # existing enumlib feedstock also skips Windows.
  skip: true  # [win]
  skip: true  # [linux and not x86_64]
  skip: true  # [osx and not arm64]

requirements:
  run:
    # Nothing: the app ships its own Julia runtime.

test:
  files:
    - struct_enum.in.fcc
  commands:
    # Engine identification — this exact token is what pymatgen's EnumlibAdaptor
    # probes to distinguish the Julia engine from the legacy Fortran enum.x.
    - enum.x --version | grep "Enumlib.jl"
    - polya.x --version | grep "Enumlib.jl"
    - makestr.x --version | grep "Enumlib.jl"
    # Same invocation style the Fortran enumlib feedstock uses: input file as a
    # positional argument.
    - enum.x struct_enum.in.fcc
    - test -f struct_enum.out
    - polya.x struct_enum.in.fcc
    # Structure generation, the third executable the Fortran feedstock ships.
    - makestr.x struct_enum.out 1 1
    - test -f vasp.1

about:
  home: https://github.com/glwhart/Enumlib.jl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Derivative-structure enumeration (Julia reimplementation of enumlib).
  description: |
    Enumlib.jl generates the derivative superstructures of a parent lattice,
    including multilattices such as HCP, over all concentrations or a restricted
    concentration range. It is a from-scratch Julia reimplementation of enumlib by
    one of its authors, and a drop-in replacement for the Fortran enum.x: the
    struct_enum.in / struct_enum.out file contract is unchanged. This package ships
    standalone enum.x and polya.x executables with a bundled Julia runtime, so no
    Julia installation is required.
  doc_url: https://glwhart.github.io/Enumlib.jl
  dev_url: https://github.com/glwhart/Enumlib.jl

extra:
  recipe-maintainers:
    - glwhart
